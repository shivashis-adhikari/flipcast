[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flipcast"
version = "0.3.0"
description = "Forecast when Postgres query plans will switch as your tables grow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
flipcast = "flipcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "RUF001", "RUF002", "RUF003",
    "PLW2901", "SIM108", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/flipcast"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL 18 server with flipcast_sizes"]
addopts = "-ra"
